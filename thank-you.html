<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thank you — Pawrincess</title><meta name="robots" content="noindex">
<link rel="icon" href="images/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/pawrincess.css">
<style>
.ty{max-width:560px;margin:0 auto;padding:70px 22px;text-align:center}
.ty .crown{font-size:3.4rem}
.ty .ordbox{display:inline-block;background:var(--pink-tint);border:1.5px solid var(--line);border-radius:14px;padding:14px 22px;margin:18px 0;font-weight:800;color:var(--ink);font-size:1.2rem;letter-spacing:.04em}
.ty a.btn{display:inline-block;background:var(--plum);color:#fff;text-decoration:none;border-radius:12px;padding:15px 26px;font-weight:800;margin:8px 6px}
.ty a.ghost{background:none;color:var(--brand);border:2px solid var(--brand)}
</style></head>
<body>
<div class="announce">👑 Thank you for joining the royal court</div>
<div class="ty">
  <div class="crown">👑</div>
  <h1>Her throne is on the way!</h1>
  <p>Thank you for your order. A confirmation email with tracking is headed to your inbox.</p>
  <div class="ordbox" id="ordbox" hidden>Order <span id="ordnum"></span></div>
  <p style="color:var(--muted)">Ships in 1–3 business days · Free 30-night snuggle guarantee</p>
  <div style="margin-top:20px">
    <a class="btn" id="receipt" href="#" target="_blank" rel="noopener" hidden>View receipt</a>
    <a class="btn ghost" href="index.html">Back to store</a>
  </div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const o = q.get('order'), r = q.get('receipt');
  if (o) { document.getElementById('ordnum').textContent = o; document.getElementById('ordbox').hidden = false; }
  if (r) { const a = document.getElementById('receipt'); a.href = r; a.hidden = false; }
</script>
</body></html>
